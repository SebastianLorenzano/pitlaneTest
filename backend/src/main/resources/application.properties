# --- Server Configuration ---
server.port=8080
spring.profiles.active=prod
server.forward-headers-strategy=framework
# --- Logging ---
#spring.main.banner-mode=console
#logging.level.org.springframework=INFO

# --- Configuration Email Sender ---
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Credentials Email sender ---
# --- Email sender ---
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# --- Configuration Email receiver (The email where the client recieves user's information for contact)---
pitlane.contact.to=${SPRING_MAIL_RECEIVER}
# THIS SHOULD BE inversores@pitlaneholding.com

# --- Configuration files path ---
pitlane.files.project.pdf=${PITLANE_FILES_PROJECT_PDF}

