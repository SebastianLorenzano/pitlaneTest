services:
  pitlane-app:
    build: .
    container_name: pitlane-app
    ports:
      - "80:8080"
    restart: unless-stopped
    environment:
      SPRING_MAIL_HOST: smtp.buzondecorreo.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: info@pitlaneholding.com
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_RECEIVER: inversores@pitlaneholding.com